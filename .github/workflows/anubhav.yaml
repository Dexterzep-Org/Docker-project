name: my_pipeline

on: 
  push:
    branches: 
      - DEV 

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

  Second_Job:
    runs-on: ubuntu-latest
    needs: My_First_Job
    steps:
      - name: build the code
        run: |
          mvn clean install -DskipTests

  Deploy_to_EC2:
    runs-on: ubuntu-latest
    needs: Second_Job
    steps:
      - name: Set up SSH and Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /path/to/your/app
            git pull origin DEV
            ./deploy.sh   # Or any other deployment command
          EOF
