name: my_pipeline

on: 
  push:
    branches: 
      - DEV 

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

  Second_Job:
    runs-on: ubuntu-latest
    needs: My_First_Job
    steps:
      - name: build the code
        run: |
          mvn clean install -DskipTests

  Deploy_to_EC2:
    runs-on: ubuntu-latest
    needs: Second_Job
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/your/app
            git pull origin DEV
            ./deploy.sh   # Or any other deployment command
