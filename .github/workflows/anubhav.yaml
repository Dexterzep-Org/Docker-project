name: my_pipeline

on: 
  push:
    branches: 
      - DEV 

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build the code
        run: |
          mvn clean install -DskipTests
          ls -l target/  # Check if the JAR file exists in the target directory

      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Copy JAR to S3 bucket
        run: |
          aws s3 cp target/docker-demo.jar s3://anubhav-github-actionv3/demo-folder/

      - name: Connect to EC2 and copy JAR from S3 to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > EC2Tutorial.pem
          chmod 600 EC2Tutorial.pem
          ssh -o StrictHostKeyChecking=no -i EC2Tutorial.pem ec2-user@ec2-3-82-138-45.compute-1.amazonaws.com 'aws s3 cp s3://anubhav-github-actionv3/demo-folder/docker-demo.jar /mycode/'

      - name: Connect to EC2, start JAR in background, and verify it's running
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > EC2Tutorial.pem
          chmod 600 EC2Tutorial.pem
          ssh -o StrictHostKeyChecking=no -i EC2Tutorial.pem ec2-user@ec2-3-82-138-45.compute-1.amazonaws.com << EOF
            # Check if the /mycode directory exists
            if [ -d /mycode ]; then
              echo "Directory /mycode exists."
              sudo chmod -R 777 /mycode
              ls -l /mycode
            else
              echo "Directory /mycode does not exist. Exiting..."
              exit 1
            fi

            # Check if the JAR file exists in /mycode and set permissions
            if [ -f /mycode/docker-demo.jar ]; then
              echo "JAR file exists in /mycode."
              sudo chmod 777 /mycode/docker-demo.jar
            else
              echo "JAR file does not exist in /mycode. Exiting..."
              exit 1
            fi

            # Start the JAR file in the background using nohup and redirect output
            cd /mycode
            nohup sudo java -jar docker-demo.jar > /mycode/docker-demo.log 2>&1 &

            # Wait for a few seconds to ensure the app has time to start
            sleep 10

            # Check if the application is running by making a request to localhost:9090
            curl -I http://localhost:9090
EOF
