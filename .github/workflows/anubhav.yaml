name: my_pipeline

on: 
  push:
    branches: 
      - DEV 

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11  # Choose a JDK version compatible with your project.
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # You can use other JDK distributions like 'zulu'.
          java-version: '11'  # Specify the JDK version.

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

  Second_Job:
    runs-on: ubuntu-latest
    needs: My_First_Job
    steps:
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install awscli -y

      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Download Project from S3
        run: |
          aws s3 cp s3://your-bucket-name/path/to/project/ ./Docker-project --recursive

      - name: Print directory structure
        run: ls -R  # Confirm the files have been downloaded correctly

      - name: build the code
        run: |
          cd Docker-project
          mvn clean install -DskipTests
