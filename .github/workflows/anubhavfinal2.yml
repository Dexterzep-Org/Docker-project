name: my_pipeline

on: 
  push:
    branches: 
      - DEV 

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build the code
        run: mvn clean install -DskipTests
      
      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Build Docker image
        run: |
          echo "FROM openjdk:11-jre-slim" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY target/docker-demo.jar /app/docker-demo.jar" >> Dockerfile
          echo "EXPOSE 8080" >> Dockerfile
          echo 'ENTRYPOINT ["java", "-jar", "/app/docker-demo.jar"]' >> Dockerfile
          docker build -t docker-demo-app:latest .
          
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Tag and Push Docker image
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/docker-demo-app:${TIMESTAMP}"
          docker tag docker-demo-app:latest $IMAGE_TAG
          docker push $IMAGE_TAG

      - name: Register ECS Task Definition
        run: |
          TASK_DEFINITION=$(cat <<EOF
          {
            "family": "docker-demo-app",
            "networkMode": "awsvpc",
            "containerDefinitions": [
              {
                "name": "docker-demo-app",
                "image": "$IMAGE_TAG",
                "memory": 512,
                "cpu": 256,
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8080,
                    "protocol": "tcp"
                  }
                ]
              }
            ],
            "requiresCompatibilities": [
              "FARGATE"
            ],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "arn:aws:iam::615299762140:role/ecsTaskExecutionRole",
            "taskRoleArn": "arn:aws:iam::615299762140:role/ecsTaskExecutionRole"
          }
          EOF
          )
          echo "$TASK_DEFINITION" > taskdef.json
          aws ecs register-task-definition \
            --family docker-demo-app \
            --cli-input-json file://taskdef.json

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster my-cluster \
            --service my-ecs-service \
            --task-definition docker-demo-app \
            --force-new-deployment
