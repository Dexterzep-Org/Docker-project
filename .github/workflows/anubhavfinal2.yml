name: my_pipeline

on:
  push:
    branches:
      - DEV

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build the code
        run: |
          mvn clean install -DskipTests
          ls -l target/  # Check if the JAR file exists in the target directory

      - name: Verify JAR file is built
        run: ls -l target/

      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Build Docker image
        run: |
          echo "FROM openjdk:11-jre-slim" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY target/docker-demo.jar /app/docker-demo.jar" >> Dockerfile
          echo "EXPOSE 8080" >> Dockerfile
          echo 'ENTRYPOINT ["java", "-jar", "/app/docker-demo.jar"]' >> Dockerfile
          docker build -t docker-demo-app:latest .

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Tag and Push Docker image
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/docker-demo-app:${TIMESTAMP}"
          docker tag docker-demo-app:latest $IMAGE_TAG
          docker push $IMAGE_TAG

      - name: SSH into EC2 and deploy container
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > EC2Tutorial.pem
          chmod 600 EC2Tutorial.pem
          ssh -o StrictHostKeyChecking=no -i EC2Tutorial.pem -t ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Image Tag: $IMAGE_TAG"
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            docker pull $IMAGE_TAG
            docker stop ecrcon1 || true
            docker rm ecrcon1 || true
            docker run -d --name ecrcon1 -p 8080:8080 $IMAGE_TAG
            sleep 10  # Allow some time for container to start
            docker logs ecrcon1  # Check container logs
            docker ps -a  # List all containers to check status
          EOF
