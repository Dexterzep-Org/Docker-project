name: my_pipeline

on: 
  push:
    branches: 
      - DEV 

jobs:
  My_First_Job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build the code
        run: |
          mvn clean install -DskipTests
      
      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}
      - name: Build Docker image
        run: |
          echo "FROM openjdk:11-jre-slim" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY target/docker-demo.jar /app/docker-demo.jar" >> Dockerfile
          echo "EXPOSE 8080" >> Dockerfile
          echo 'ENTRYPOINT ["java", "-jar", "/app/docker-demo.jar"]' >> Dockerfile
          docker build -t docker-demo-app:latest .
      
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Tag and Push Docker image
        id: tag_and_push
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="615299762140.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/docker-demo-app:${TIMESTAMP}"
          docker tag docker-demo-app:latest $IMAGE_TAG
          docker push $IMAGE_TAG
          # Set the IMAGE_TAG as an environment variable to be reused in later steps
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
      - name: Register ECS Task Definition
        run: |
          # Fetch the latest task definition for the family
          EXISTING_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition Demo_Task_Defination1-ci-cd)

          # Extract the existing container definitions and update the image
          UPDATED_CONTAINER_DEFINITIONS=$(echo $EXISTING_TASK_DEF | jq -r '.taskDefinition.containerDefinitions' | jq ".[0].image=\"${{ env.IMAGE_TAG }}\" | .")

          # Register a new revision with updated container definitions
          NEW_TASK_DEF=$(jq -n \
            --argjson containerDefinitions "$UPDATED_CONTAINER_DEFINITIONS" \
            --arg family "Demo_Task_Defination1-ci-cd" \
            --arg requiresCompatibilities "$(echo $EXISTING_TASK_DEF | jq -r '.taskDefinition.requiresCompatibilities')" \
            --arg cpu "$(echo $EXISTING_TASK_DEF | jq -r '.taskDefinition.cpu')" \
            --arg memory "$(echo $EXISTING_TASK_DEF | jq -r '.taskDefinition.memory')" \
            --arg executionRoleArn "$(echo $EXISTING_TASK_DEF | jq -r '.taskDefinition.executionRoleArn')" \
            --arg taskRoleArn "$(echo $EXISTING_TASK_DEF | jq -r '.taskDefinition.taskRoleArn')" \
            '{
              family: $family,
              networkMode: "awsvpc",
              containerDefinitions: $containerDefinitions,
              requiresCompatibilities: $requiresCompatibilities,
              cpu: $cpu,
              memory: $memory,
              executionRoleArn: $executionRoleArn,
              taskRoleArn: $taskRoleArn
            }')

          echo "$NEW_TASK_DEF" > taskdef.json
          aws ecs register-task-definition \
            --cli-input-json file://taskdef.json
      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster cicdcluster1 \
            --service cicd-service1 \
            --task-definition Demo_Task_Defination1-ci-cd \
            --desired-count 2 \
            --force-new-deployment
