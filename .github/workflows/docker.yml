name: my_pipeline
on: 
  push:
     branches: 
        - DEV
jobs:
  My_First_Job:
       runs-on: ubuntu-latest
       steps:
       - name: checkout code
         uses: actions/checkout@v3	
       - name: Print working directory
         run: pwd
  Second_Job:
       runs-on: ubuntu-latest
       needs: My_First_Job
       steps:
       - name: cd to code
         run: cd /home/runner/work/Docker-project/Docker-project
       - name: build the code
         run: |
            mvn clean install -DskipTests
