name: my_pipeline
on: 
  push:
     branches: 
        - DEV
jobs:
  Build_Copy_Job:
       runs-on: ubuntu-latest
       steps:
       - name: checkout code
         uses: actions/checkout@v3
       - name: setup jdk
         uses: actions/setup-java@v4
         with:
           java-version: '11'
           distribution: 'temurin'
           cache: maven
       - name: run maven
         run: mvn clean install -DskipTests
       - run: ls -lrt target/*
