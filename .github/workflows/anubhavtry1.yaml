name: ECS CI/CD Pipeline

on:
  push:
    branches:
      - DEV  # Trigger the pipeline on push to the main branch

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 615299762140
  ECR_REPOSITORY_NAME: anubhavrepo
  ECS_CLUSTER_NAME: AnubhavCluster
  ECS_SERVICE_NAME: Anubhavservice
  ECS_TASK_DEFINITION_NAME: Anubhav-TD
  IMAGE_TAG: ${{ github.sha }}  # Use the commit SHA as the image tag

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
    
    - name: Check out code
      uses: actions/checkout@v3
    
    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Set up Java and Maven
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adoptopenjdk'
    
    - name: Build with Maven
      run: |
        mvn clean install  # Adjust if your build command is different
    
    - name: Log in to Amazon ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    
    - name: Build Docker image
      run: |
        docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:$IMAGE_TAG .
    
    - name: Push Docker image to ECR
      run: |
        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:$IMAGE_TAG
    
    - name: Register ECS Task Definition
      run: |
        task_definition=$(aws ecs register-task-definition \
          --family $ECS_TASK_DEFINITION_NAME \
          --network-mode awsvpc \
          --cpu 256 \
          --memory 512 \
          --execution-role-arn arn:aws:iam::$AWS_ACCOUNT_ID:role/ecsTaskExecutionRole \
          --container-definitions "[{
            \"name\": \"Anubhavcon1\",
            \"image\": \"$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:$IMAGE_TAG\",
            \"essential\": true,
            \"portMappings\": [{\"containerPort\": 80, \"hostPort\": 80, \"protocol\": \"tcp\"}],
            \"logConfiguration\": {
              \"logDriver\": \"awslogs\",
              \"options\": {
                \"awslogs-group\": \"/ecs/$ECS_TASK_DEFINITION_NAME\",
                \"awslogs-region\": \"$AWS_REGION\",
                \"awslogs-stream-prefix\": \"ecs\"
              }
            }
          }]") && echo $task_definition | jq -r .taskDefinition.taskDefinitionArn > task_definition_arn.txt
    
    - name: Update ECS Service
      run: |
        ECS_TASK_DEFINITION_ARN=$(cat task_definition_arn.txt)
        aws ecs update-service \
          --cluster $ECS_CLUSTER_NAME \
          --service $ECS_SERVICE_NAME \
          --task-definition $ECS_TASK_DEFINITION_ARN \
          --desired-count 1
    
    - name: Wait for ECS deployment to complete
      run: |
        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER_NAME \
          --services $ECS_SERVICE_NAME
